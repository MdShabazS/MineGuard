name: mineguard-mg010-verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mg010-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate serial task gate
        run: node scripts/task-gate.mjs validate
      - name: Type check
        run: npm run typecheck
      - name: Production client build
        run: npm run build
      - name: Backend and integration unit tests
        run: npm test
      - name: Install headless Chromium and Linux dependencies
        run: npx --yes playwright@1.64.1 install --with-deps chromium
      - name: Browser end-to-end tests
        env:
          MINEGUARD_E2E_BROWSER: chromium
        run: npm run test:e2e
